<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://discord.gg/moondiety">
  <title>Join Moondiety Discord</title>
  <meta name="theme-color" content="#0a0a0f">
  
  <link rel="apple-touch-icon" sizes="180x180" href="/media/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/media/favicon-96x96.png">
  <link rel="shortcut icon" href="/media/favicon.ico">
  <link rel="manifest" href="/media/site.webmanifest">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .discord-card {
      background: var(--glass-bg-md);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 4rem 3rem;
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
      max-width: 620px;
      width: 90%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      position: relative;
      animation: hero-fade-in 0.6s ease both;
    }
    .discord-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at top center, rgba(88,101,242,0.1), transparent 70%);
      pointer-events: none;
    }
    .discord-icon {
      font-size: 6rem;
      color: #5865F2;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 25px rgba(88,101,242,0.5));
      animation: hero-fade-in 0.6s ease 0.1s both;
    }
    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      animation: hero-fade-in 0.6s ease 0.2s both;
      background: linear-gradient(90deg, #5865F2, #8EA1E1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-sub {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
      animation: hero-fade-in 0.6s ease 0.3s both;
    }
    .btn-discord-join {
      background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
      color: white;
      box-shadow: 0 6px 28px rgba(88,101,242,0.38);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: hero-fade-in 0.6s ease 0.4s both;
    }
    .btn-discord-join:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(88,101,242,0.52);
    }
    .redirecting-text {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2rem;
      animation: hero-fade-in 0.6s ease 0.5s both;
    }
  </style>
</head>
<body>
  <div class="discord-card">
    <div class="discord-icon">
      <i class="fab fa-discord"></i>
    </div>
    <h1 class="page-title">Moondiety Discord</h1>
    <p class="page-sub">Join our official community for scripts, updates, keys & support</p>
    <a href="https://discord.gg/moondiety" class="btn-discord-join">
      <i class="fab fa-discord"></i> Join Discord Now
    </a>
    <p class="redirecting-text">
      Redirecting automatically...<br>
      If nothing happens, <a href="https://discord.gg/moondiety" style="color:var(--text-light); text-decoration:underline;">click here</a>
    </p>
  </div>
  
  <script>
    setTimeout(() => {
      window.location.href = "https://discord.gg/moondiety";
    }, 1200);
  </script>
</body>
</html>
